name: 功能请求

description: 提议新的用户能力或改进现有工作流。

title: "[Feature] "

labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先搜索现有 Issue，并重点描述需要解决的问题，而不是只给出实现名称。

        涉及安全漏洞时不要使用公开表单，请按 `SECURITY.md` 私密报告。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 我没有在表单中加入真实课表、作业、凭据或其他个人信息。
          required: true
        - label: 我理解功能请求可能因范围、隐私、安全或维护成本而暂缓。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、当前困难和受影响用户，不要使用真实个人数据。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述用户可见行为；如有界面或命令示例，请使用虚构数据。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明你已尝试或考虑过的替代做法，以及它们为何不足。

  - type: checkboxes
    id: impact
    attributes:
      label: 可能影响
      description: 选择所有适用项，便于评估范围。
      options:
        - label: 数据库、配置格式或迁移
        - label: 新增联网行为、远程服务或遥测
        - label: 隐私、安全或权限
        - label: 新增或升级第三方依赖
        - label: Windows、macOS、Linux 跨平台行为
        - label: CLI 或 API 兼容性
        - label: 打包、Docker 或安装体积

  - type: textarea
    id: impact_details
    attributes:
      label: 影响说明
      description: 若上方有选中项，请说明数据流、兼容性、迁移、降级和风险控制；没有请写“无”。
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 可以在方向确认后提交 Pull Request
        - 可以帮助测试或撰写文档
        - 暂时只能提供需求反馈
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可加入脱敏原型、相关标准或其他背景。
